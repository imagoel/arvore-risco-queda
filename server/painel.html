<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo — Risco de Queda de Árvore</title>
  <!-- URL base da API injetada pelo servidor (para resolver caminhos relativos de fotos) -->
  <script>window.__API_BASE__ = '__APIBASE_PLACEHOLDER__';</script>
  <!-- Google Maps JS API — padrão recomendado (loading=async) -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=__GMAPS_API_KEY__&callback=initMap&loading=async&language=pt-BR&region=BR"
  ></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F4F6F9; color: #1A2E22; }

    /* ── Header ── */
    header {
      background: #1A2E22;
      color: #fff;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
    header span { font-size: 13px; opacity: 0.65; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-kmz {
      background: #5B2EBE;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn-kmz:hover { opacity: 0.85; }
    .btn-logout {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.7;
      transition: opacity 0.15s;
      padding: 8px 12px;
    }
    .btn-logout:hover { opacity: 1; }

    /* ── Layout ── */
    .layout {
      display: flex;
      height: 100vh;
      padding-top: 60px;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 360px;
      min-width: 300px;
      background: #fff;
      border-right: 1px solid #E5E7EB;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #E5E7EB;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 8px;
      font-size: 13px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab-btn.active { color: #1A2E22; border-bottom-color: #5B2EBE; }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 12px; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid #E5E7EB;
      background: #F9FAFB;
    }
    .stat-chip {
      flex: 1;
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-chip .stat-num { font-size: 20px; font-weight: 800; color: #1A2E22; }
    .stat-chip .stat-label { font-size: 11px; color: #888; margin-top: 2px; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-color: #5B2EBE44; }
    .card.selected { border-color: #5B2EBE; box-shadow: 0 0 0 2px #5B2EBE33; }
    .card-header { display: flex; align-items: flex-start; gap: 10px; }
    .card-icon { width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .card-title { font-size: 14px; font-weight: 700; color: #1A2E22; font-style: italic; line-height: 1.3; }
    .card-sub { font-size: 12px; color: #888; margin-top: 2px; }
    .risk-pill {
      display: inline-block;
      border-radius: 100px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin-top: 6px;
    }
    .card-coords { font-size: 11px; color: #AAAAAA; font-family: monospace; margin-top: 4px; }
    .card-photo { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
    .card-footer { display: flex; justify-content: flex-end; margin-top: 8px; }
    .btn-delete {
      background: none;
      border: 1px solid #EF5350;
      color: #EF5350;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-delete:hover { background: #EF5350; color: #fff; }

    /* ── Checkbox de seleção ── */
    .card-checkbox {
      width: 18px; height: 18px;
      accent-color: #5B2EBE;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .btn-relatorio {
      background: #2D6A4F;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn-relatorio:hover { opacity: 0.85; }
    .btn-relatorio:disabled { opacity: 0.4; cursor: not-allowed; }
    .selection-count {
      font-size: 11px;
      color: #fff;
      background: #5B2EBE;
      border-radius: 10px;
      padding: 1px 7px;
      margin-left: 4px;
    }

    /* ── Region card ── */
    .region-card-title { font-size: 14px; font-weight: 700; color: #1A2E22; }
    .region-card-sub { font-size: 12px; color: #888; margin-top: 2px; }
    .region-badge { display: inline-block; background: #5B2EBE22; color: #5B2EBE; border-radius: 100px; padding: 2px 10px; font-size: 11px; font-weight: 700; margin-top: 6px; }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Loading / empty ── */
    .loading { text-align: center; padding: 40px 20px; color: #888; font-size: 14px; }
    .empty { text-align: center; padding: 40px 20px; color: #AAAAAA; font-size: 14px; }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #E5E7EB; border-top-color: #5B2EBE; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Filter bar ── */
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid #E5E7EB; background: #F9FAFB; }
    .filter-chip {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid #E5E7EB;
      background: #fff;
      cursor: pointer;
      color: #555;
      transition: all 0.12s;
    }
    .filter-chip.active { background: #1A2E22; color: #fff; border-color: #1A2E22; }

    /* ── Info window override ── */
    .gm-style .gm-style-iw-c { border-radius: 12px !important; padding: 0 !important; }
    .gm-style .gm-style-iw-d { overflow: hidden !important; }
    .info-window { padding: 14px; max-width: 260px; font-family: -apple-system, sans-serif; }
    .info-window h3 { font-size: 15px; font-weight: 700; color: #1A2E22; font-style: italic; margin-bottom: 4px; }
    .info-window p { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 4px; }
    .info-window img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .info-window .coords { font-size: 11px; color: #AAAAAA; font-family: monospace; }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:22px;">🌳</span>
    <div>
      <h1>Painel Administrativo</h1>
      <span>Índice de Risco de Queda de Árvore</span>
    </div>
  </div>
  <div class="header-actions">
    <span id="last-update" style="font-size:12px;opacity:0.5;"></span>
    <button class="btn-relatorio" onclick="gerarRelatorio()" id="btn-relatorio">
      📄 Gerar Relatório
    </button>
    <a id="btn-kmz" class="btn-kmz" href="/api/kmz" download>
      ⬇ Baixar KMZ
    </a>
    <a href="/api/logout" class="btn-logout" title="Sair">🚪 Sair</a>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-chip">
        <div class="stat-num" id="stat-trees">—</div>
        <div class="stat-label">Árvores</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="stat-regions">—</div>
        <div class="stat-label">Regiões</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" id="stat-high-risk">—</div>
        <div class="stat-label">Alto Risco</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="sidebar-tabs">
      <button class="tab-btn active" id="tab-trees" onclick="switchTab('trees')">🌳 Árvores</button>
      <button class="tab-btn" id="tab-regions" onclick="switchTab('regions')">⬡ Regiões</button>
    </div>

    <!-- Filter bar (trees only) -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-chip active" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-chip" onclick="setFilter('Risco Muito Baixo', this)" style="border-color:#4FC3F7;color:#01579B;">Risco Muito Baixo</button>
      <button class="filter-chip" onclick="setFilter('Risco Baixo', this)" style="border-color:#66BB6A;color:#1B5E20;">Risco Baixo</button>
      <button class="filter-chip" onclick="setFilter('Alerta - Monitorar Árvore', this)" style="border-color:#FFA726;color:#E65100;">Alerta - Monitorar</button>
      <button class="filter-chip" onclick="setFilter('Alerta - Supressão da Árvore', this)" style="border-color:#EF5350;color:#B71C1C;">Alerta - Supressão</button>
    </div>

    <!-- List -->
    <div class="sidebar-content" id="sidebar-content">
      <div class="loading"><div class="spinner"></div><br/>Carregando dados...</div>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let allTrees = [];
let allRegions = [];
let activeTab = 'trees';
let activeFilter = 'all';
let map = null;
let markers = [];
let polygons = [];
let infoWindow = null;
let selectedId = null;
let selectedTreeIds = new Set();
let selectedRegionIds = new Set();

// ── Risk colors ───────────────────────────────────────────────────────────────
const RISK_COLORS = {
  'Risco Muito Baixo':            { pin: '#4FC3F7', bg: '#E1F5FE', text: '#01579B' },
  'Risco Baixo':                  { pin: '#66BB6A', bg: '#E8F5E9', text: '#1B5E20' },
  'Alerta - Monitorar Árvore':    { pin: '#FFA726', bg: '#FFF3E0', text: '#E65100' },
  'Alerta - Supressão da Árvore': { pin: '#EF5350', bg: '#FFEBEE', text: '#B71C1C' },
  'default':                      { pin: '#2D6A4F', bg: '#D8F3DC', text: '#1A2E22' },
};

function irqNorm(irqValor) {
  if (irqValor == null) return null;
  return Math.min(Math.round((parseFloat(irqValor) / 10000) * 100), 100);
}

function getRiskColor(label) {
  return RISK_COLORS[label] || RISK_COLORS['default'];
}

// ── Fetch data ────────────────────────────────────────────────────────────────
async function fetchData() {
  try {
    const [treesRes, regionsRes] = await Promise.all([
      fetch('/api/trpc/arvores.listar?batch=1&input=%7B%220%22%3A%7B%22json%22%3Anull%7D%7D'),
      fetch('/api/trpc/regioes.listar?batch=1&input=%7B%220%22%3A%7B%22json%22%3Anull%7D%7D'),
    ]);

    const treesJson = await treesRes.json();
    const regionsJson = await regionsRes.json();

    allTrees = treesJson[0]?.result?.data?.json ?? [];
    allRegions = regionsJson[0]?.result?.data?.json ?? [];

    updateStats();
    renderSidebar();
    renderMap();

    const now = new Date();
    document.getElementById('last-update').textContent =
      'Atualizado às ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    console.error('[Painel] Erro ao buscar dados:', err);
    document.getElementById('sidebar-content').innerHTML =
      '<div class="empty">Erro ao carregar dados.<br/>Verifique a conexão com o servidor.</div>';
  }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-trees').textContent = allTrees.length;
  document.getElementById('stat-regions').textContent = allRegions.length;
  const highRisk = allTrees.filter(t =>
    t.irqClassificacao === 'Alerta - Monitorar Árvore' || t.irqClassificacao === 'Alerta - Supressão da Árvore'
  ).length;
  document.getElementById('stat-high-risk').textContent = highRisk;
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-trees').classList.toggle('active', tab === 'trees');
  document.getElementById('tab-regions').classList.toggle('active', tab === 'regions');
  document.getElementById('filter-bar').style.display = tab === 'trees' ? 'flex' : 'none';
  renderSidebar();
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSidebar();
}

// ── Sidebar render ────────────────────────────────────────────────────────────
function renderSidebar() {
  const container = document.getElementById('sidebar-content');

  if (activeTab === 'trees') {
    const filtered = activeFilter === 'all'
      ? allTrees
      : allTrees.filter(t => t.irqClassificacao === activeFilter);

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty">Nenhuma árvore encontrada.</div>';
      return;
    }

    container.innerHTML = filtered.map(tree => {
      const rc = getRiskColor(tree.irqClassificacao);
      const norm = irqNorm(tree.irqValor);
      const irqText = norm != null ? `IRQ: ${norm}%` : 'IRQ não calculado';
      const riskPill = tree.irqClassificacao
        ? `<span class="risk-pill" style="background:${rc.pin}">${tree.irqClassificacao}</span>`
        : '';
      const photo = tree.fotoUrl
        ? `<img class="card-photo" src="${tree.fotoUrl.startsWith('/') ? window.__API_BASE__ + tree.fotoUrl : tree.fotoUrl}" alt="Foto" loading="lazy" onerror="this.onerror=null;this.style.background='#f3f4f6';this.style.display='flex';this.alt='Foto indispon\u00edvel';" />`
        : '';
      const date = tree.createdAt
        ? new Date(tree.createdAt).toLocaleDateString('pt-BR')
        : '';
      return `
        <div class="card ${selectedId === tree.localId ? 'selected' : ''}"
             onclick="selectTree('${tree.localId}')">
          <div class="card-header">
            <input type="checkbox" class="card-checkbox" ${selectedTreeIds.has(tree.localId) ? 'checked' : ''}
              onclick="event.stopPropagation(); toggleTreeSelection('${tree.localId}')" />
            <div class="card-icon" style="background:${rc.bg}">🌳</div>
            <div style="flex:1;min-width:0;">
              <div class="card-title">${tree.nomeCientifico || 'Árvore sem nome'}</div>
              <div class="card-sub">${irqText}${date ? ' · ' + date : ''}</div>
              ${riskPill}
            </div>
          </div>
          ${tree.descricao ? `<div style="font-size:13px;color:#555;margin-top:8px;line-height:1.5;">${tree.descricao}</div>` : ''}
          ${photo}
          <div class="card-coords">${parseFloat(tree.latitude).toFixed(6)}, ${parseFloat(tree.longitude).toFixed(6)}</div>
          <div class="card-footer">
            <button class="btn-delete" onclick="event.stopPropagation(); deleteTree('${tree.localId}', '${(tree.nomeCientifico || 'Árvore').replace(/'/g, "\\'")}')">Excluir</button>
          </div>
        </div>`;
    }).join('');
  } else {
    if (allRegions.length === 0) {
      container.innerHTML = '<div class="empty">Nenhuma região cadastrada.</div>';
      return;
    }

    container.innerHTML = allRegions.map(region => {
      const coords = Array.isArray(region.coordenadas)
        ? region.coordenadas
        : JSON.parse(region.coordenadas || '[]');
      const photo = region.fotoUrl
        ? `<img class="card-photo" src="${region.fotoUrl.startsWith('/') ? window.__API_BASE__ + region.fotoUrl : region.fotoUrl}" alt="Foto" loading="lazy" onerror="this.onerror=null;this.style.background='#f3f4f6';this.style.display='flex';this.alt='Foto indispon\u00edvel';" />`
        : '';
      const date = region.createdAt
        ? new Date(region.createdAt).toLocaleDateString('pt-BR')
        : '';
      return `
        <div class="card ${selectedId === region.localId ? 'selected' : ''}"
             onclick="selectRegion('${region.localId}')">
          <div class="card-header">
            <input type="checkbox" class="card-checkbox" ${selectedRegionIds.has(region.localId) ? 'checked' : ''}
              onclick="event.stopPropagation(); toggleRegionSelection('${region.localId}')" />
            <div class="card-icon" style="background:#EDE9FE">⬡</div>
            <div style="flex:1;min-width:0;">
              <div class="region-card-title">${region.titulo || 'Região sem título'}</div>
              <div class="region-card-sub">${coords.length} vértices${date ? ' · ' + date : ''}</div>
              <span class="region-badge">Polígono</span>
            </div>
          </div>
          ${region.descricao ? `<div style="font-size:13px;color:#555;margin-top:8px;line-height:1.5;">${region.descricao}</div>` : ''}
          ${photo}
          <div class="card-footer">
            <button class="btn-delete" onclick="event.stopPropagation(); deleteRegion('${region.localId}', '${(region.titulo || 'Região').replace(/'/g, "\\'")}')">Excluir</button>
          </div>
        </div>`;
    }).join('');
  }
}

// ── Select tree ───────────────────────────────────────────────────────────────
function selectTree(localId) {
  selectedId = localId;
  renderSidebar();

  const tree = allTrees.find(t => t.localId === localId);
  if (!tree || !map) return;

  const pos = { lat: parseFloat(tree.latitude), lng: parseFloat(tree.longitude) };
  map.panTo(pos);
  map.setZoom(17);

  const marker = markers.find(m => m.treeId === localId);
  if (marker && infoWindow) {
    infoWindow.setContent(buildTreeInfoWindow(tree));
    infoWindow.open(map, marker);
  }
}

// ── Select region ─────────────────────────────────────────────────────────────
function selectRegion(localId) {
  selectedId = localId;
  renderSidebar();

  const region = allRegions.find(r => r.localId === localId);
  if (!region || !map) return;

  const coords = Array.isArray(region.coordenadas)
    ? region.coordenadas
    : JSON.parse(region.coordenadas || '[]');

  if (coords.length === 0) return;

  const bounds = new google.maps.LatLngBounds();
  coords.forEach(c => bounds.extend({ lat: c.latitude, lng: c.longitude }));
  map.fitBounds(bounds, { top: 60, bottom: 60, left: 60, right: 60 });

  const poly = polygons.find(p => p.regionId === localId);
  if (poly && infoWindow) {
    const center = bounds.getCenter();
    infoWindow.setContent(buildRegionInfoWindow(region, coords.length));
    infoWindow.setPosition(center);
    infoWindow.open(map);
  }
}

// ── Info window builders ──────────────────────────────────────────────────────
function buildTreeInfoWindow(tree) {
  const rc = getRiskColor(tree.irqClassificacao);
  const riskPill = tree.irqClassificacao
    ? `<span style="display:inline-block;background:${rc.pin};color:#fff;border-radius:100px;padding:2px 10px;font-size:11px;font-weight:700;margin-bottom:6px;">${tree.irqClassificacao}</span>`
    : '';
  const photo = tree.fotoUrl
    ? `<img src="${tree.fotoUrl.startsWith('/') ? window.__API_BASE__ + tree.fotoUrl : tree.fotoUrl}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;" onerror="this.onerror=null;this.style.display='none';" />`
    : '';
  const norm = irqNorm(tree.irqValor);
  const irq = norm != null ? `<p><strong>IRQ:</strong> ${norm}%</p>` : '';
  const desc = tree.descricao
    ? `<p>${tree.descricao}</p>`
    : '';
  return `<div class="info-window">
    ${photo}
    <h3>${tree.nomeCientifico || 'Árvore sem nome'}</h3>
    ${riskPill}
    ${irq}
    ${desc}
    <p class="coords">${parseFloat(tree.latitude).toFixed(6)}, ${parseFloat(tree.longitude).toFixed(6)}</p>
  </div>`;
}

function buildRegionInfoWindow(region, numVertices) {
  const photo = region.fotoUrl
    ? `<img src="${region.fotoUrl.startsWith('/') ? window.__API_BASE__ + region.fotoUrl : region.fotoUrl}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px;" onerror="this.onerror=null;this.style.display='none';" />`
    : '';
  const desc = region.descricao
    ? `<p>${region.descricao}</p>`
    : '';
  return `<div class="info-window">
    ${photo}
    <h3>${region.titulo || 'Região sem título'}</h3>
    <p style="color:#888;font-size:12px;">${numVertices} vértices</p>
    ${desc}
  </div>`;
}

// ── Map render ──────────────────────────────────────────────────────────────
// Flag que indica se é o primeiro carregamento (para fitBounds inicial)
let isFirstLoad = true;

function renderMap() {
  if (!map) return;

  // ── 1. Construir conjuntos de IDs atuais para diff ────────────────────────
  const currentTreeIds = new Set(allTrees.map(t => t.localId));
  const currentRegionIds = new Set(allRegions.map(r => r.localId));

  // ── 2. Remover overlays que não existem mais no backend ───────────────────
  // Usa setMap(null) individualmente — não recria todos, evita flickering
  markers = markers.filter(m => {
    if (!currentTreeIds.has(m.treeId)) {
      m.setMap(null);
      return false;
    }
    return true;
  });
  polygons = polygons.filter(p => {
    if (!currentRegionIds.has(p.regionId)) {
      p.setMap(null);
      return false;
    }
    return true;
  });

  // ── 3. Construir conjuntos de IDs já renderizados ─────────────────────────
  const renderedTreeIds = new Set(markers.map(m => m.treeId));
  const renderedRegionIds = new Set(polygons.map(p => p.regionId));

  // ── 4. Adicionar apenas overlays novos (não existentes ainda) ─────────────
  allTrees.forEach(tree => {
    if (renderedTreeIds.has(tree.localId)) return; // já está no mapa, não recria

    const rc = getRiskColor(tree.irqClassificacao);
    const lat = parseFloat(tree.latitude);
    const lng = parseFloat(tree.longitude);
    if (isNaN(lat) || isNaN(lng)) return;

    const marker = new google.maps.Marker({
      position: { lat, lng },
      map,
      title: tree.nomeCientifico || 'Árvore',
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 10,
        fillColor: rc.pin,
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 2,
      },
    });
    marker.treeId = tree.localId;

    marker.addListener('click', () => {
      selectedId = tree.localId;
      renderSidebar();
      scrollToCard(tree.localId);
      infoWindow.setContent(buildTreeInfoWindow(tree));
      infoWindow.open(map, marker);
    });

    markers.push(marker);
  });

  allRegions.forEach(region => {
    if (renderedRegionIds.has(region.localId)) return; // já está no mapa, não recria

    const coords = Array.isArray(region.coordenadas)
      ? region.coordenadas
      : JSON.parse(region.coordenadas || '[]');
    if (coords.length < 3) return;

    const path = coords.map(c => ({ lat: c.latitude, lng: c.longitude }));

    const poly = new google.maps.Polygon({
      paths: path,
      map,
      fillColor: '#5B2EBE',
      fillOpacity: 0.15,
      strokeColor: '#5B2EBE',
      strokeWeight: 2.5,
      strokeOpacity: 0.8,
    });
    poly.regionId = region.localId;

    poly.addListener('click', (e) => {
      selectedId = region.localId;
      renderSidebar();
      scrollToCard(region.localId);
      infoWindow.setContent(buildRegionInfoWindow(region, coords.length));
      infoWindow.setPosition(e.latLng);
      infoWindow.open(map);
    });

    polygons.push(poly);
  });

  // ── 5. fitBounds apenas no primeiro carregamento ──────────────────────────
  // Nos refreshes subsequentes, o usuário pode ter movido o mapa manualmente
  if (isFirstLoad && (allTrees.length > 0 || allRegions.length > 0)) {
    const bounds = new google.maps.LatLngBounds();
    allTrees.forEach(t => {
      const lat = parseFloat(t.latitude);
      const lng = parseFloat(t.longitude);
      if (!isNaN(lat) && !isNaN(lng)) bounds.extend({ lat, lng });
    });
    allRegions.forEach(r => {
      const coords = Array.isArray(r.coordenadas) ? r.coordenadas : JSON.parse(r.coordenadas || '[]');
      coords.forEach(c => bounds.extend({ lat: c.latitude, lng: c.longitude }));
    });
    if (!bounds.isEmpty()) {
      map.fitBounds(bounds, { top: 80, bottom: 80, left: 80, right: 80 });
    }
    isFirstLoad = false;
  }
}

function scrollToCard(localId) {
  setTimeout(() => {
    const cards = document.querySelectorAll('.card');
    for (const card of cards) {
      if (card.getAttribute('onclick')?.includes(localId)) {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        break;
      }
    }
  }, 50);
}

// ── Delete ───────────────────────────────────────────────────────────────────
async function deleteTree(localId, nome) {
  if (!confirm(`Excluir a árvore "${nome}"?\n\nEssa ação não pode ser desfeita.`)) return;
  try {
    const res = await fetch('/api/trpc/arvores.deletar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ json: { localId } }),
    });
    if (!res.ok) throw new Error('Erro ' + res.status);
    allTrees = allTrees.filter(t => t.localId !== localId);
    if (selectedId === localId) { selectedId = null; if (infoWindow) infoWindow.close(); }
    updateStats();
    renderSidebar();
    renderMap();
  } catch (err) {
    console.error('[Painel] Erro ao excluir árvore:', err);
    alert('Erro ao excluir árvore. Verifique a conexão.');
  }
}

async function deleteRegion(localId, titulo) {
  if (!confirm(`Excluir a região "${titulo}"?\n\nEssa ação não pode ser desfeita.`)) return;
  try {
    const res = await fetch('/api/trpc/regioes.deletar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ json: { localId } }),
    });
    if (!res.ok) throw new Error('Erro ' + res.status);
    allRegions = allRegions.filter(r => r.localId !== localId);
    if (selectedId === localId) { selectedId = null; if (infoWindow) infoWindow.close(); }
    updateStats();
    renderSidebar();
    renderMap();
  } catch (err) {
    console.error('[Painel] Erro ao excluir região:', err);
    alert('Erro ao excluir região. Verifique a conexão.');
  }
}

// ── Seleção para relatório ────────────────────────────────────────────────────
function toggleTreeSelection(localId) {
  if (selectedTreeIds.has(localId)) selectedTreeIds.delete(localId);
  else selectedTreeIds.add(localId);
  updateRelatorioButton();
}

function toggleRegionSelection(localId) {
  if (selectedRegionIds.has(localId)) selectedRegionIds.delete(localId);
  else selectedRegionIds.add(localId);
  updateRelatorioButton();
}

function updateRelatorioButton() {
  const total = selectedTreeIds.size + selectedRegionIds.size;
  const btn = document.getElementById('btn-relatorio');
  if (total > 0) {
    btn.innerHTML = `📄 Gerar Relatório <span class="selection-count">${total}</span>`;
  } else {
    btn.innerHTML = '📄 Gerar Relatório';
  }
}

async function gerarRelatorio() {
  const btn = document.getElementById('btn-relatorio');
  const textoOriginal = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳ Gerando...';

  try {
    const hasSelection = selectedTreeIds.size > 0 || selectedRegionIds.size > 0;
    const body = {
      arvoreIds: hasSelection ? Array.from(selectedTreeIds) : null,
      regiaoIds: hasSelection ? Array.from(selectedRegionIds) : null,
    };

    const res = await fetch('/api/relatorio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) throw new Error('Erro ' + res.status);

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = res.headers.get('Content-Disposition')?.match(/filename="(.+)"/)?.[1] || 'relatorio.docx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error('[Painel] Erro ao gerar relatório:', err);
    alert('Erro ao gerar relatório. Verifique a conexão.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
  }
}

// ── Google Maps init ──────────────────────────────────────────────────────────
window.initMap = function() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: -14.235, lng: -51.9253 },
    zoom: 5,
    mapTypeId: 'roadmap',
    mapTypeControl: true,
    fullscreenControl: true,
    streetViewControl: false,
    styles: [
      { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
    ],
  });

  infoWindow = new google.maps.InfoWindow({ maxWidth: 280 });

  fetchData();

  // Auto-refresh every 60 seconds
  setInterval(fetchData, 60000);
};
