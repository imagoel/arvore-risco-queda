<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Painel Administrativo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F4F6F9;
      color: #1A2E22;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-icon { font-size: 48px; margin-bottom: 12px; }
    .login-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .login-card p { font-size: 14px; color: #888; margin-bottom: 24px; }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #5B2EBE; }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #1A2E22;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 8px;
    }
    .btn-login:hover { opacity: 0.85; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      color: #EF5350;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-icon">🌳</div>
  <h1>Painel Administrativo</h1>
  <p>Indice de Risco de Queda de Arvore</p>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="user">Usuario</label>
      <input type="text" id="user" name="user" autocomplete="username" required />
    </div>
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    <div class="error-msg" id="error-msg">Usuario ou senha invalidos.</div>
  </form>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const errorMsg = document.getElementById('error-msg');
  errorMsg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
      }),
    });

    if (res.ok) {
      window.location.href = '/painel';
    } else {
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    errorMsg.textContent = 'Erro de conexao. Tente novamente.';
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>

</body>
</html>
